name: Deploy Windows Fix Wizard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install --no-audit --prefer-offline

      - name: 🏗️ Build Web Application for GitHub Pages
        run: |
          npm run build:pages || npx vite build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          mkdir -p dist/data
          cp data/issues.json dist/data/issues.json 2>/dev/null || true
          cp data/github-feed.json dist/data/github-feed.json 2>/dev/null || true
          cp data/ai-model-registry.json dist/data/ai-model-registry.json 2>/dev/null || true
          cp data/github-collector-options.json dist/data/github-collector-options.json 2>/dev/null || true
          test -f dist/index.html
          ls -la ./dist

      - name: 🌐 Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: './dist'
          include-hidden-files: 'true'

  deploy:
    needs: build
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: 📡 Notify Live App Webhook (Pages Deployed)
        if: ${{ secrets.APP_WEBHOOK_URL != '' && secrets.CRON_SECRET != '' }}
        env:
          APP_WEBHOOK_URL: ${{ secrets.APP_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node -e '
            const crypto = require("crypto");
            const base = (process.env.APP_WEBHOOK_URL || "").replace(/\/+$/, "");
            const secret = process.env.CRON_SECRET || "";
            if (!base.startsWith("http") || !secret) process.exit(0);
            const body = JSON.stringify({
              eventType: "pages-deploy",
              source: "GitHub Pages Deploy Workflow",
              summary: "GitHub Pages 정적 웹 및 데이터셋 배포 완료 (" + (process.env.PAGE_URL || "github.io") + ")",
              details: { pageUrl: process.env.PAGE_URL || "", commit: process.env.GITHUB_SHA || "" }
            });
            const sig = "sha256=" + crypto.createHmac("sha256", secret).update(body, "utf8").digest("hex");
            fetch(base + "/api/github/webhook/heartbeat", {
              method: "POST",
              signal: AbortSignal.timeout(10000),
              headers: {
                "Content-Type": "application/json",
                "x-cron-secret": secret,
                "x-winfix-signature-256": sig
              },
              body
            }).then(async (r) => {
              const t = await r.text();
              console.log("Pages deploy webhook status:", r.status, t.slice(0, 180));
            }).catch((e) => console.warn("Pages webhook skipped:", e.message));
          ' || true
