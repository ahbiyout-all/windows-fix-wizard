name: Windows Fix Autonomous Collector & GitOps Sync

on:
  # Automated scheduled run (every 6 hours)
  schedule:
    - cron: '0 */6 * * *'

  # Manual execution trigger from GitHub Web UI or API dispatch
  workflow_dispatch:
    inputs:
      topic:
        description: 'Target Error Category (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - '업데이트'
          - '네트워크'
          - '시스템/블루스크린'
          - '스토어/앱'
          - '정품인증'
          - '보안/백신'
          - '오디오/사운드'
          - '디스플레이/그래픽'
      batch_size:
        description: 'Number of fixes to collect (1-4)'
        required: false
        default: '2'

# Ensure the workflow has write permissions to commit changes back and trigger Pages deployment
permissions:
  contents: write
  actions: write

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install project dependencies
        run: |
          npm ci || npm install --no-audit --prefer-offline

      - name: 🤖 Run Autonomous Windows Fix Collector via Gemini AI
        id: run-collector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_WEBHOOK_URL: ${{ secrets.APP_WEBHOOK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_TOPIC: ${{ github.event.inputs.topic || 'all' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '2' }}
        run: |
          npx tsx scripts/github-collector.ts

      - name: 🚀 Commit & Push updated issues dataset (GitOps)
        id: git-push-step
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if data files changed
          if [ -n "$(git status --porcelain data/issues.json data/github-feed.json src/data/knownIssues.ts)" ]; then
            git add data/issues.json data/github-feed.json src/data/knownIssues.ts
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "🤖 [GitOps] Autonomous AI Windows Fixes collected ($TIMESTAMP)"
            
            # Retry push in case of concurrent commits
            for i in {1..3}; do
              git pull --rebase origin ${{ github.ref_name }} || true
              git push origin HEAD:${{ github.ref_name }} && break || sleep 5
            done
            echo "✅ Successfully committed and pushed updated dataset to repository."
            echo "dataset_changed=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No dataset changes to commit in this cycle."
            echo "dataset_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 🌐 Trigger GitHub Pages Deployment
        if: steps.git-push-step.outputs.dataset_changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering deploy-pages.yml workflow for latest changes..."
          gh workflow run deploy-pages.yml --ref ${{ github.ref_name }} || echo "Workflow dispatch skipped or not required"
